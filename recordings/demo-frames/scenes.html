<!doctype html>
<!-- Camera-eye view of a network patch panel for the cable-swap demo. Open scenes.html#N (1-6) to draw scene N.
     Rendered with: chromium --headless --window-size=640,360 --screenshot=frames/N.jpg "file://$PWD/scenes.html#N" -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1b1d20}svg{display:block}</style></head>
<body><svg id="s" width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const n = +(location.hash.slice(1) || 1), s = document.getElementById("s");
const portX = i => 70 + i * 64, PY = 150, TARGET = 4;
const colors = ["#3a7bd5", "#3a7bd5", "#d9534f", "#3a7bd5", "#2e8b57", "#3a7bd5", "#888", "#d9534f"];
let g = "";
const add = x => g += x;

add(`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f35"/>
  <stop offset="1" stop-color="#15171a"/></linearGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient></defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="20" y="40" width="10" height="290" fill="#5c6168"/><rect x="610" y="40" width="10" height="290" fill="#5c6168"/>`);
for (const y of [60, 300]) add(`<rect x="30" y="${y}" width="580" height="30" fill="#30343a" stroke="#41464d"/>
  <circle cx="44" cy="${y + 15}" r="5" fill="#777"/><circle cx="596" cy="${y + 15}" r="5" fill="#777"/>`);
add(`<rect x="30" y="100" width="580" height="110" rx="4" fill="#3d4249" stroke="#555b63" stroke-width="2"/>
  <circle cx="44" cy="155" r="5" fill="#888"/><circle cx="596" cy="155" r="5" fill="#888"/>
  <text x="50" y="120" fill="#c8ccd2" font-family="monospace" font-size="11">PANEL A  -  RACK 3</text>`);

for (let i = 0; i < 8; i++) {
  const x = portX(i), tgt = i === TARGET;
  add(`<rect x="${x - 4}" y="126" width="56" height="16" rx="2" fill="${tgt ? "#f4f1de" : "#e6e6e6"}"/>
    <text x="${x + 24}" y="138" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold"
      fill="#222">A${i + 1}</text>
    <rect x="${x}" y="${PY}" width="48" height="40" rx="3" fill="#111" stroke="#666"/>
    <rect x="${x + 8}" y="${PY + 4}" width="32" height="10" fill="#555"/>`);
  if (tgt) add(`<text x="${x + 24}" y="202" text-anchor="middle" font-family="monospace" font-size="9" fill="#e8d36a">DB-02</text>`);
  if (!tgt) cable(x, colors[i], 0);
}
function cable(x, color, slack) {
  add(`<rect x="${x + 6}" y="${PY + 6}" width="36" height="30" rx="3" fill="${color}" stroke="#0004"/>
    <rect x="${x + 14}" y="${PY + 34}" width="20" height="14" fill="${color}"/>`);
  const c = slack ? `M${x + 24} ${PY + 48} C ${x + 24} ${PY + 140}, ${x - 40} ${PY + 120}, ${x - 30} ${PY + 80}
    S ${x - 10} ${PY + 50}, ${x + 30} 360` : `M${x + 24} ${PY + 48} L${x + 24 + (x % 3 - 1) * 8} 360`;
  add(`<path d="${c}" stroke="${color}" stroke-width="12" fill="none" stroke-linecap="round"/>`);
}
function hand(x, y, angle) {
  add(`<g transform="translate(${x} ${y}) rotate(${angle})" opacity=".97">
    <path d="M-34 0 C -40 50, -30 140, -20 220 L 60 220 C 66 150, 64 60, 46 10 Z" fill="#c68a68"/>
    <rect x="-12" y="-70" width="20" height="90" rx="10" fill="#d49a76"/>
    <rect x="12" y="-30" width="18" height="60" rx="9" fill="#c68a68"/>
    <rect x="32" y="-20" width="17" height="52" rx="8" fill="#c08262"/>
    <ellipse cx="-2" cy="-62" rx="7" ry="5" fill="#e8c2ad"/></g>`);
}
const tx = portX(TARGET);
if (n === 1) cable(tx, "#3a7bd5", 0);
if (n === 2) { cable(tx, "#3a7bd5", 0); hand(tx + 26, 210, -8); }
if (n === 3) {
  add(`<g transform="translate(${tx} ${PY + 120})"><rect x="6" y="0" width="36" height="30" rx="3" fill="#3a7bd5"/>
    <path d="M24 30 L24 220" stroke="#3a7bd5" stroke-width="12"/></g>`);
  hand(tx + 30, 300, 0);
}
if (n === 4) {
  add(`<g transform="translate(250 230) rotate(-12)"><rect x="0" y="0" width="70" height="34" rx="4" fill="#e3b505"/>
    <path d="M70 17 L330 40" stroke="#e3b505" stroke-width="12"/>
    <rect x="90" y="4" width="46" height="28" rx="2" fill="#fbfbf3" stroke="#bbb"/>
    <text x="113" y="17" text-anchor="middle" font-family="monospace" font-size="9" fill="#222">A5</text>
    <text x="113" y="28" text-anchor="middle" font-family="monospace" font-size="8" fill="#222">DB-02</text></g>`);
  add(`<g transform="translate(470 300) rotate(-30)"><rect x="0" y="0" width="60" height="30" rx="4" fill="#e3b505"/>
    <rect x="-46" y="3" width="40" height="24" rx="2" fill="#fbfbf3" stroke="#bbb"/></g>`);
  hand(330, 290, -40); hand(250, 310, 25);
}
if (n >= 5) cable(tx, "#e3b505", 1);
if (n === 5) hand(tx + 60, 230, -20);
add(`<rect width="640" height="360" fill="url(#vig)"/>
  <text x="12" y="350" fill="#fff8" font-family="monospace" font-size="10">BRIO 0  ${["", "10:02:04", "10:02:09", "10:02:15", "10:02:22", "10:02:33", "10:02:40"][n]}</text>`);
s.innerHTML = g;
</script></body></html>
