<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journeyman</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0b0d; --panel:#141418; --line:#26262c; --text:#e8e8ec; --dim:#8a8a96; --live:#7cc4ff; --you:#ffc65c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 -apple-system, "Inter", system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  .pill { border:1px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--dim); font-size:13px; }
  .pill.live { color:var(--live); border-color:var(--live); }
  main { display:grid; grid-template-columns: 1.1fr 1fr 1.2fr; gap:14px; padding:14px; height:calc(100vh - 56px); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; overflow:auto; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim); margin:0 0 10px; }
  #cam { width:100%; border-radius:8px; background:#000; aspect-ratio:16/9; object-fit:cover; }
  #strip { display:flex; gap:6px; margin-top:8px; overflow-x:auto; }
  #strip img { height:54px; border-radius:4px; opacity:.85; }
  .msg { margin:8px 0; padding:8px 10px; border-radius:8px; background:#1b1b21; }
  .msg.jm { border-left:3px solid var(--live); }
  .msg.q { border-left:3px solid var(--you); background:#221d12; font-weight:600; }
  .msg .who { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .step { border-top:1px solid var(--line); padding:10px 0; }
  .step:first-child { border-top:none; }
  .step .t { font-weight:600; }
  .step.cur { background:#13202c; border-radius:8px; padding:10px; }
  .step.done .t::before { content:"✓ "; color:var(--live); }
  .kv { color:var(--dim); font-size:13px; margin-top:3px; }
  .kv b { color:var(--text); font-weight:500; }
  .tag { font-size:11px; color:var(--you); border:1px solid var(--you); border-radius:4px; padding:0 4px; margin-left:6px; }
  .warn { color:var(--you); font-size:13px; margin-top:3px; }
  .notes { color:var(--dim); font-size:12px; margin-top:12px; }
  #question { display:none; }
</style>
</head>
<body>
<header>
  <h1>JOURNEYMAN</h1>
  <span class="pill" id="mode">idle</span>
  <span class="pill" id="proc"></span>
  <span class="pill" id="camstat"></span>
  <span class="pill live">runs on this device · no cloud</span>
</header>
<main>
  <section>
    <h2>Eyes</h2>
    <img id="cam" alt="">
    <div id="strip"></div>
    <div class="notes" id="notes"></div>
  </section>
  <section>
    <h2>Conversation</h2>
    <div class="msg q" id="question"></div>
    <div id="convo"></div>
  </section>
  <section>
    <h2 id="cardtitle">Procedure card</h2>
    <div id="card"></div>
    <h2 style="margin-top:16px">Open questions for the expert</h2>
    <div id="openq" class="kv"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pending = false;

function render(s) {
  $("mode").textContent = s.mode === "capture" ? "capturing expert" : s.mode === "teach" ? "teaching new hire" : "idle";
  $("mode").className = "pill" + (s.mode !== "idle" ? " live" : "");
  $("proc").textContent = s.procedure || "no procedure";
  const sess = s.session_id ? s.sessions[s.session_id] : null;
  const said = s.said.map(x => ({t: x.t, who: "jm", text: x.text}));
  const heard = sess ? sess.transcript.map(u => ({t: u.t1, who: "you", text: u.text})) : [];
  const convo = heard.concat(said.filter(x => !sess || x.t >= sess.started)).sort((a, b) => b.t - a.t).slice(0, 14);
  $("convo").innerHTML = convo.map(m => `<div class="msg ${m.who === "jm" ? "jm" : ""}"><div class="who">${m.who === "jm" ? "Journeyman" : "Heard"}</div>${esc(m.text)}</div>`).join("");
  const q = s.pending_question;
  $("question").style.display = q ? "block" : "none";
  if (q) $("question").innerHTML = `<div class="who">Asking about: ${esc(q.about)}</div>${esc(q.text)}`;
  const proc = s.procedures[s.procedure] || Object.values(s.procedures)[0];
  $("cardtitle").textContent = proc ? `Procedure card · ${proc.name}` : "Procedure card";
  const done = sess ? sess.done_steps : [];
  $("card").innerHTML = proc && proc.steps.length ? proc.steps.map((st, i) => `
    <div class="step ${s.mode === "teach" && i === s.teach_index ? "cur" : ""} ${done.includes(st.id) ? "done" : ""}">
      <div class="t">${st.n}. ${esc(st.title)}${st.confirmed ? "" : '<span class="tag">unconfirmed</span>'}</div>
      ${st.action ? `<div class="kv"><b>Do:</b> ${esc(st.action)}</div>` : ""}
      ${st.whys.map(w => `<div class="kv"><b>Why:</b> ${esc(w.why)}${w.consequence ? ` <b>If skipped:</b> ${esc(w.consequence)}` : ""}</div>`).join("")}
      ${st.warnings.map(w => `<div class="warn">Common mistake: ${esc(w)}</div>`).join("")}
    </div>`).join("") : '<div class="kv">Nothing captured yet. Say "start capture" and work.</div>';
  $("openq").innerHTML = s.open_questions.length ? s.open_questions.map(x => `<div>• ${esc(x.question)}</div>`).join("") : "None";
  $("strip").innerHTML = s.frames.slice(-8).map(f => `<img src="/api/frames/${f.id}.jpg" title="${f.id}">`).join("");
  $("notes").innerHTML = s.notes.slice(-3).reverse().map(n => `<div>${esc(n.level)}: ${esc(n.text)}</div>`).join("");
}

async function refresh() {
  if (pending) return;
  pending = true;
  setTimeout(async () => {
    pending = false;
    try { render(await (await fetch("/api/state")).json()); } catch (e) {}
  }, 250);
}

function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("snapshot", e => render(JSON.parse(e.data)));
  es.onmessage = refresh;
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}

setInterval(async () => {
  $("cam").src = "/api/frame/latest.jpg?" + Date.now();
  try { const st = (await (await fetch("/api/ops/status", {method: "POST", body: "{}"})).json()).result; $("camstat").textContent = st.camera.source; } catch (e) {}
}, 1000);
connect();
</script>
</body>
</html>
