<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journeyman</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#0a0a0c; --panel:#131317; --raise:#1a1a20; --line:#26262e;
    --text:#ececf1; --mid:#a9a9b5; --dim:#6e6e7a;
    --live:#5ccfff; --live-bg:#0f2532; --you:#ffb648; --you-bg:#2a1f0c;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); overflow:hidden;
         font:18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .live { color:var(--live); }
  .you { color:var(--you); }
  .dim { color:var(--dim); }

  header { display:flex; align-items:center; gap:28px; padding:14px 24px; border-bottom:1px solid var(--line); height:104px; }
  .brand { font-size:14px; letter-spacing:4px; color:var(--dim); font-weight:600; }
  #mode { font-size:44px; font-weight:800; letter-spacing:1.5px; white-space:nowrap; }
  #mode .g { display:inline-block; width:1.1em; }
  #proc { font-size:20px; color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .right { margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:8px; min-width:0; }
  #local { border:2px solid var(--line); border-radius:999px; padding:5px 16px; font-size:18px; font-weight:600; color:var(--text); white-space:nowrap; }
  #health { font-size:15px; color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:820px; }

  main { display:grid; grid-template-columns:1.2fr 1fr 1.15fr; gap:16px; padding:16px; height:calc(100vh - 104px); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; min-height:0; display:flex; flex-direction:column; }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:2px; color:var(--dim); margin:0 0 12px; font-weight:600; }
  .scroll { overflow:auto; min-height:0; }

  #now { border-radius:12px; padding:18px 20px; background:var(--raise); border-left:6px solid var(--line); }
  #now.ask { background:var(--you-bg); border-left-color:var(--you); }
  #now.say { border-left-color:var(--live); }
  #nowlabel { font-size:15px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; }
  #nowtext { font-size:38px; line-height:1.22; font-weight:650; }
  #nowtext.long { font-size:29px; }
  #nowtext.idle { font-size:26px; color:var(--mid); font-weight:500; }
  #recent { margin-top:16px; flex:1; }
  .line { padding:9px 0; border-top:1px solid var(--line); font-size:20px; color:var(--mid); display:flex; gap:14px; }
  .line .who { flex:0 0 74px; font-size:13px; letter-spacing:1.5px; font-weight:700; padding-top:5px; color:var(--dim); }
  .line.jm { color:var(--text); }

  #camwrap { position:relative; border-radius:10px; overflow:hidden; background:#000; flex:1 1 auto; min-height:200px; }
  #cam { width:100%; height:100%; object-fit:contain; display:block; }
  #camchip { position:absolute; left:10px; top:10px; background:rgba(0,0,0,.72); border-radius:6px; padding:3px 10px; font-size:15px; font-weight:700; letter-spacing:1px; }
  #nofeed { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--dim); font-size:18px; text-align:center; padding:20px; }
  #strip { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:6px; margin-top:8px; min-height:52px; }
  #strip img { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:5px; opacity:.8; display:block; }
  #strip img:last-child { opacity:1; outline:2px solid var(--live); outline-offset:-2px; }
  #counts { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin-top:auto; padding-top:14px; }
  .count { background:var(--raise); border-radius:10px; padding:10px 12px; }
  .count b { display:block; font-size:44px; line-height:1.05; font-weight:800; font-variant-numeric:tabular-nums; }
  .count span { font-size:13px; color:var(--mid); text-transform:uppercase; letter-spacing:.5px; display:block; line-height:1.25; }

  #cardtitle { display:flex; justify-content:space-between; gap:12px; }
  .step { padding:12px 12px 12px 10px; border-top:1px solid var(--line); display:flex; gap:12px; }
  .step:first-child { border-top:none; }
  .step .g { flex:0 0 28px; font-size:22px; font-weight:800; color:var(--dim); text-align:center; }
  .step .t { font-size:22px; font-weight:700; }
  .step .kv { font-size:16px; color:var(--mid); margin-top:3px; }
  .step .kv b { color:var(--text); font-weight:600; }
  .step.cur { background:var(--live-bg); border-radius:10px; border-top-color:transparent; }
  .step.cur .g, .step.cur .t { color:var(--live); }
  .step.cur + .step { border-top-color:transparent; }
  .step.done .g { color:var(--mid); }
  .step.done .t { color:var(--mid); }
  .tag { font-size:13px; font-weight:700; letter-spacing:.5px; color:var(--you); border:1.5px solid var(--you); border-radius:5px; padding:0 6px; margin-left:8px; vertical-align:3px; white-space:nowrap; }
  .warn { font-size:16px; color:var(--you); margin-top:4px; font-weight:600; }
  #openq { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  #openq div { font-size:17px; color:var(--you); margin-top:4px; }
  .empty { color:var(--dim); font-size:20px; padding:8px 0; }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">JOURNEYMAN</div>
    <div id="mode" class="dim"><span class="g">○</span>IDLE</div>
  </div>
  <div id="proc"></div>
  <div class="right">
    <div id="local">⌂ runs on this device · no cloud</div>
    <div id="health">connecting…</div>
  </div>
</header>
<main>
  <section>
    <h2>Now</h2>
    <div id="now"><div id="nowlabel" class="dim">Waiting</div><div id="nowtext" class="idle">Connecting to Journeyman…</div></div>
    <div id="recent" class="scroll"></div>
  </section>
  <section>
    <h2>Eyes</h2>
    <div id="camwrap">
      <img id="cam" alt="">
      <div id="nofeed"><div style="font-size:30px">○</div><div>NO CAMERA FEED</div><div id="camsrc" style="font-size:15px"></div></div>
      <div id="camchip" class="dim">○ NO FEED</div>
    </div>
    <div id="strip"></div>
    <div id="counts"></div>
  </section>
  <section>
    <h2 id="cardtitle"><span>Procedure card</span><span id="cardrev"></span></h2>
    <div id="cardbody" class="scroll"><div id="card"></div><div id="openq"></div></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MODES = {
  capture: ["●", "CAPTURING EXPERT", "live"],
  teach: ["●", "TEACHING NEW HIRE", "live"],
  idle: ["○", "IDLE", "dim"],
};
let last = null, linked = false, camStatus = null, pending = false, lastCardKey = "", lastStrip = "";

function currentSession(s) {
  if (s.session_id && s.sessions[s.session_id]) return s.sessions[s.session_id];
  const all = Object.values(s.sessions || {}).sort((a, b) => a.started - b.started);
  return all.length ? all[all.length - 1] : null;
}

function render(s) {
  last = s;
  const m = MODES[s.mode] || MODES.idle;
  $("mode").className = m[2];
  $("mode").innerHTML = `<span class="g">${m[0]}</span>${m[1]}`;
  const sess = currentSession(s);
  const procName = s.procedure || (sess && sess.procedure) || Object.keys(s.procedures)[0];
  const proc = s.procedures[procName];
  const steps = proc ? proc.steps : [];
  $("proc").textContent = procName ? `${procName}${sess && sess.trainee ? " · trainee " + sess.trainee : ""}` : "";
  renderNow(s, sess, steps);
  renderCounts(s, sess, steps);
  renderCard(s, sess, proc, steps);
  const strip = s.frames.slice(-6).map(f => `<img src="/api/frames/${esc(f.id)}.jpg" alt="">`).join("");
  if (strip !== lastStrip) $("strip").innerHTML = lastStrip = strip;
  renderHealth();
}

function renderNow(s, sess, steps) {
  const live = sess && s.session_id === sess.id;
  const said = s.said.map(x => ({t: x.t, jm: true, text: x.text}));
  const heard = sess ? sess.transcript.map(u => ({t: u.t1, jm: false, text: u.text})) : [];
  const lines = heard.concat(sess ? said.filter(x => x.t >= sess.started - 1) : said).sort((a, b) => b.t - a.t);
  const q = s.pending_question;
  const now = $("now"), label = $("nowlabel"), text = $("nowtext");
  let big = null;
  if (q) {
    now.className = "ask";
    label.className = "you";
    label.textContent = "◆ Journeyman is asking you";
    big = q.text;
  } else if (live && lines.find(x => x.jm)) {
    const latest = lines.find(x => x.jm), slip = sess.mistakes[sess.mistakes.length - 1];
    const n = s.teach_index + 1, step = s.mode === "teach" && n <= steps.length ? `Step ${n} of ${steps.length}` : "";
    big = latest.text;
    if (slip && slip.t >= latest.t - 1) {
      now.className = "ask";
      label.className = "you";
      label.textContent = `⚠ Slip caught${step ? " · " + step : ""}`;
    } else {
      now.className = "say";
      label.className = "live";
      label.textContent = step ? `▶ ${step}` : "▶ Journeyman said";
    }
  } else {
    now.className = "";
    label.className = "dim";
    label.textContent = "○ Waiting";
  }
  if (big) {
    text.className = big.length > 110 ? "long" : "";
    text.textContent = big;
  } else {
    text.className = "idle";
    text.textContent = 'Say "start capture" to record an expert, or "teach mode" to train a new hire.';
  }
  const rest = lines.filter(x => x.text !== big).slice(0, 6);
  $("recent").innerHTML = rest.map(x => `<div class="line ${x.jm ? "jm" : ""}"><div class="who">${x.jm ? "SAID" : "HEARD"}</div><div>${esc(x.text)}</div></div>`).join("");
}

function renderCounts(s, sess, steps) {
  const since = sess ? sess.started : Infinity;
  const teach = sess && sess.kind === "teach";
  const newSteps = steps.filter(st => (st.created || 0) >= since).length;
  const reasons = steps.reduce((n, st) => n + st.whys.filter(w => (w.t || 0) >= since).length, 0);
  const openq = s.open_questions.filter(x => x.t >= since).length;
  const slips = sess ? sess.mistakes.length : 0;
  const cells = [
    teach ? [`${sess.done_steps.length}/${steps.length}`, "steps done", ""] : [newSteps, "steps", ""],
    [reasons, "reasons", ""],
    [openq, "open questions", openq ? "you" : ""],
    [slips, "slips caught", slips ? "you" : ""],
  ];
  $("counts").innerHTML = `<h2 style="grid-column:1/-1;margin:0">${sess && s.session_id === sess.id ? "Learned this session" : sess ? "Learned last session" : "Learned this session"}</h2>` +
    cells.map(c => `<div class="count"><b class="${c[2]}">${esc(c[0])}</b><span>${c[1]}</span></div>`).join("");
}

function renderCard(s, sess, proc, steps) {
  $("cardtitle").firstChild.textContent = proc ? `Procedure card · ${proc.name}` : "Procedure card";
  $("cardrev").textContent = proc ? `${steps.length} step${steps.length === 1 ? "" : "s"} · r${proc.rev}` : "";
  const teach = s.mode === "teach";
  const done = sess && sess.kind === "teach" ? sess.done_steps : [];
  $("card").innerHTML = steps.length ? steps.map((st, i) => {
    const isDone = done.includes(st.id), cur = teach && i === s.teach_index && !isDone;
    const glyph = isDone ? "✓" : cur ? "▶" : teach ? "○" : st.n + ".";
    const num = teach || isDone ? `${st.n}. ` : "";
    return `<div class="step ${cur ? "cur" : ""} ${isDone ? "done" : ""}" ${cur ? 'id="curstep"' : ""}>
      <div class="g">${glyph}</div><div>
      <div class="t">${num}${esc(st.title || st.id)}${st.confirmed ? "" : '<span class="tag">? UNCONFIRMED</span>'}</div>
      ${st.action ? `<div class="kv"><b>Do:</b> ${esc(st.action)}</div>` : ""}
      ${st.whys.map(w => `<div class="kv"><b>Why:</b> ${esc(w.why)}${w.consequence ? ` <b>If skipped:</b> ${esc(w.consequence)}` : ""}${w.confirmed || !st.confirmed ? "" : '<span class="tag">? UNCONFIRMED</span>'}</div>`).join("")}
      ${st.warnings.map(w => `<div class="warn">⚠ Common mistake: ${esc(w)}</div>`).join("")}
      </div></div>`;
  }).join("") : '<div class="empty">Nothing captured yet. Say "start capture" and work.</div>';
  const qs = s.open_questions.filter(x => !proc || !x.procedure || x.procedure === proc.name);
  $("openq").innerHTML = qs.length ? `<h2>Open questions for the expert</h2>` + qs.map(x => `<div>? ${esc(x.question)}</div>`).join("") : "";
  const key = `${s.mode}:${s.teach_index}:${steps.length}`;
  if (key !== lastCardKey) {
    lastCardKey = key;
    const target = $("curstep");
    if (target) target.scrollIntoView({block: "center"});
    else if (s.mode === "capture") $("cardbody").scrollTop = $("cardbody").scrollHeight;
  }
}

function renderHealth() {
  const parts = [linked ? '<span class="live">● live link</span>' : '<span class="you">◆ reconnecting</span>'];
  if (camStatus) {
    const age = camStatus.latest_age_s;
    parts.push(age == null ? `camera: ${esc(camStatus.source)}` : age < 5 ? `camera ✓ ${age.toFixed(1)} s old` : `<span class="you">⚠ camera frame ${Math.round(age)} s old</span>`);
  }
  const notes = (last && last.notes) || [];
  const latest = re => { for (let i = notes.length - 1; i >= 0; i--) { const m = re.exec(notes[i].text); if (m) return m; } return null; };
  const ears = latest(/^heard in ([\d.]+)s/), eyes = latest(/^observed \d+ frames in ([\d.]+)s/);
  if (ears) parts.push(`ears ${ears[1]} s`);
  if (eyes) parts.push(`vision ${eyes[1]} s`);
  const bad = notes.filter(n => n.level === "error" || n.level === "warn").pop();
  if (bad && Date.now() / 1000 - bad.t < 120) parts.push(`<span class="you">⚠ ${esc(bad.text.slice(0, 80))}</span>`);
  else if (last) parts.push("✓ no errors");
  $("health").innerHTML = parts.join("  ·  ");
}

async function refresh() {
  if (pending) return;
  pending = true;
  setTimeout(async () => {
    pending = false;
    try { render(await (await fetch("/api/state")).json()); } catch (e) {}
  }, 200);
}

function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { linked = true; renderHealth(); };
  es.addEventListener("snapshot", e => { linked = true; render(JSON.parse(e.data)); });
  es.onmessage = refresh;
  es.onerror = () => { linked = false; renderHealth(); es.close(); setTimeout(connect, 1500); };
}

function setFeed(ok) {
  const age = camStatus && camStatus.latest_age_s, stale = ok && age != null && age >= 5;
  $("nofeed").style.display = ok ? "none" : "flex";
  $("cam").style.visibility = ok ? "visible" : "hidden";
  $("camchip").className = stale ? "you" : ok ? "live" : "dim";
  $("camchip").textContent = stale ? `◆ STALE · ${Math.round(age)} s old` : ok ? "● LIVE" : "○ NO FEED";
}

function pollCam() {
  const im = new Image();
  im.onload = () => { $("cam").src = im.src; setFeed(true); };
  im.onerror = () => setFeed(false);
  im.src = "/api/frame/latest.jpg?" + Date.now();
}

async function pollStatus() {
  try {
    camStatus = (await (await fetch("/api/ops/status", {method: "POST", body: "{}"})).json()).result.camera;
    $("camsrc").textContent = camStatus.source;
  } catch (e) { camStatus = null; }
  renderHealth();
}

setFeed(false);
setInterval(pollCam, 1000);
setInterval(pollStatus, 2000);
pollCam(); pollStatus(); connect();
</script>
</body>
</html>
